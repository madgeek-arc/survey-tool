<div page-content [fullWidth]="true">
  <div actions class="uk-section-primary uk-preserve-color">
    <sidebar-mobile-toggle class="uk-hidden@m uk-display-block uk-padding-small"></sidebar-mobile-toggle>
  </div>
  <div inner>
    @if (ready) {
      <div class="uk-section-default" style="min-height: 90vh;">
        <div>
          <app-survey [payload]="surveyAnswer" [model]="survey" [tabsHeader]="tabsHeader" [downloadPDF]="downloadPDF"
                      [mandatoryFieldsText]="mandatoryFieldsText" [subType]="subType" [enableWebsocket]="true"
                      [enableCommenting]="true" [userId]="userInfo.user.email"
                      [successMessage]="successMessage" [errorMessage]="errorMessage"
                      (submitForm)="submitForm($event)" (valid)="validateSurveyAnswer($event)">

            @if (survey) {
              <div class="form-top-section uk-flex uk-flex-middle">
                @if (!hasHeader) {
                  <a [routerLink]="backRoute" class="uk-margin-small-right" title="Back">
                    <span class="material-icons">keyboard_backspace</span>
                  </a>
                }
                <span class="survey-title-text" [title]="survey.name">{{ survey.name }}</span>
              </div>
            }
            @if (survey) {
              <div class="form-actions-section uk-flex uk-flex-middle">
                @if (!freeView) {
                  @if (activeUsers === null) {
                    <div class="uk-margin-small-right">
                      <div data-uk-spinner></div>
                    </div>
                  } @else {
                    <div id="concurrentEdit" class="uk-margin-small-right">
                      @for (user of activeUsers; track user) {
                        <a [id]="user.sessionId" class="uk-icon" aria-expanded="false">
                          <svg height="42" width="42">
                            <circle cx="21" cy="21" r="18" stroke-width="1" [attr.fill]="user.color"></circle>
                            <text dy=".4em" font-size="16" text-anchor="middle" x="50%" y="50%" fill="white" class="uk-text-bold">
                              {{ getInitials(user.fullname) }}
                            </text>
                            <circle cx="34" cy="34" r="7" stroke-width="1" fill="white"></circle>
                            <text x="28" y="40" fill="black" alignment-baseline="middle">
                              <tspan class="material-icons" style="font-size: 12px"> {{ actionIcon(user.action) }}</tspan>
                            </text>
                          </svg>
                        </a>
                      }
                    </div>
                  }
                }
                @if (validate) {
                  <button class="uk-button uk-button-primary" (click)="child.validateForm()">
                    Validate
                  </button>
                }
              </div>
            }
            @if (survey) {
              <div class="form-notice-section">
                <p class="uk-margin-bottom" [innerHTML]="survey.notice"></p>
              </div>
            }
            <div class="form-action-bar titleAndActionsBar uk-flex uk-flex-right">
              <div>
                @if (!readonly) {
                  <button class="uk-button uk-button-secondary uk-margin-left" (click)="child.parentSubmit()">
                    Save
                  </button>
                }
              </div>
            </div>
          </app-survey>
        </div>
      </div>
    }
  </div>
</div>
